name: Security & Integrity CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Hermetic Security & Test Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Clean Install Dependencies
        run: npm ci

      - name: Static Secret Scanner Gate
        run: node scripts/check-secrets.mjs

      - name: Hermetic Unit & Integration Tests
        run: node tests/run_all_tests.mjs --ci

      - name: Knowledge Sync Gate
        run: npm run check:knowledge
